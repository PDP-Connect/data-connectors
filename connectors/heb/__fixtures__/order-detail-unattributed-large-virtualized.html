<!-- Synthetic browser fixture: no owner or provider data (all names/hrefs are
     synthetic, generated by this file's own inline script). Models the 0924
     shortfall's real shape: a large order (80 declared items, inside H-E-B's
     69-112 observed range) whose detail page virtualizes rows in a scrollable
     inner viewport that mounts only a small window (18 rows) at a time, with
     NO data-index or aria-posinset attribute on any row — unlike
     order-detail-inner-scrollport.html, which DOES carry data-index and so
     never needs the content-identity fallback this fixture exercises. Every
     href is unique (no repeated product), which is the one shape the new
     content-identity accumulation path is designed to safely prove complete:
     see collectDetailSurface's `content:href=` handling in index.ts. -->
<!doctype html>
<html>
  <body>
    <main>
      <section>
        <h2 data-qe-id="orderDetailsGroupTitle">Synthetic groceries</h2>
        <div id="order-items-scrollport" style="height: 180px; overflow-y: auto">
          <div id="rows" style="position: relative"></div>
        </div>
      </section>
    </main>
    <script>
      const TOTAL = 80;
      const WINDOW_SIZE = 18;
      const allItems = Array.from({ length: TOTAL }, (_, index) => ({
        href: `/product-detail/unattributed/${index}`,
        name: `Synthetic item ${index}`,
      }));
      const rows = document.querySelector("#rows");
      const scrollport = document.querySelector("#order-items-scrollport");
      let first = 0;

      function render() {
        const last = Math.min(first + WINDOW_SIZE, TOTAL);
        const visible = allItems.slice(first, last);
        // No data-index/aria-posinset anywhere: this is the real bug shape —
        // H-E-B's own virtualizer is believed (not yet live-verified) to omit
        // both attributes, unlike the inner-scrollport fixture's rows.
        rows.style.height = `${TOTAL * 40}px`;
        rows.innerHTML = visible
          .map(
            (item) =>
              `<li data-qe-id="itemRow">
                <a data-qe-id="itemRowDetailsName" href="${item.href}">${item.name}</a>
                <span data-qe-id="checkoutItemPrice">$1.00</span>
                <span data-qe-id="orderItemQty">Qty: 1</span>
              </li>`
          )
          .join("");
      }

      scrollport.addEventListener("scroll", () => {
        if (scrollport.scrollTop + scrollport.clientHeight >= scrollport.scrollHeight - 2) {
          first = Math.min(first + WINDOW_SIZE, TOTAL - WINDOW_SIZE);
        } else {
          // Partial forward scroll: advance the window proportionally so
          // consecutive snapshots overlap instead of jumping straight to the
          // end, mirroring how the real collector scrolls by ~80% of
          // clientHeight rather than jumping to scrollHeight.
          const ratio = scrollport.scrollTop / (scrollport.scrollHeight - scrollport.clientHeight);
          first = Math.min(Math.round(ratio * (TOTAL - WINDOW_SIZE)), TOTAL - WINDOW_SIZE);
        }
        render();
      });
      render();
    </script>
  </body>
</html>
