<meta name="user-login" content="sample-user">
<nav>
	<ul>
		<li><a data-tab-item="overview" href="/sample-user"><span data-component data-content>Overview</span></a></li>
		<li>
			<a data-tab-item="repositories" href="/sample-user?tab=repositories">
				<span data-component data-content>Repositories</span>

		</li>
	</ul>
</nav>

	<div class="h-card">

			<span class="p-name vcard-fullname" itemprop="name"></span>
			<span class="p-nickname vcard-username" itemprop="additionalName">sample-user</span>
		</h1>
		<img class="avatar avatar-user" src="https://avatars.githubusercontent.com/u/1">
		<div class="js-profile-editable-area">
			<div class="p-note user-profile-bio"></div>
			<ul class="vcard-details"></ul>
		</div>
		<div class="d-none d-md-block">
			<h2 class="h4 mb-2"><a href="/sample-user?tab=achievements">Achievements</a></h2>
			<a href="/sample-user?achievement=sample-badge&tab=achievements"><img class="achievement-badge-sidebar" alt="Achievement: Sample Badge" src="https://github.githubassets.com/assets/sample-badge.png"></a>
		</div>
		<div class="d-md-none d-block">
			<h2 class="h4 mb-2"><a href="/sample-user?tab=achievements">Achievements</a></h2>

		</div>
		<h2 class="mb-2 h4">Organizations</h2>
		<a aria-label="sample-org" itemprop="follows" class="avatar-group-item" href="/sample-org"><img class="avatar" alt="@sample-org" src="https://avatars.githubusercontent.com/u/2"></a>
	</div>
	<h2 class="f4 mb-2 text-normal">Popular repositories</h2>
	<div class="js-pinned-items-reorder-container">
		<ol>
			<li class="tmp-mb-3 d-flex flex-content-stretch sortable-button-item pinned-item-list-item js-pinned-item-list-item col-12 col-md-6 col-lg-6">
				<div class="Box d-flex tmp-p-3 width-full public source">
					<div class="pinned-item-list-item-content">
						<div class="d-flex width-full position-relative"><div class="flex-1">
							<span class="position-relative"><a class="Link mr-1 tmp-mr-1 text-bold wb-break-word" href="/sample-owner/demo"><span class="owner text-normal">sample-owner / </span><span class="repo">demo</span></a><tool-tip class="sr-only position-absolute">sample-owner/demo</tool-tip></span>
							<span class="Label Label--secondary">Public</span>
						</div></div>
						<p class="pinned-item-desc color-fg-muted text-small mt-2 mb-0">Synthetic pinned repository</p>
						<p class="mb-0 mt-2 f6 color-fg-muted"><span class="tmp-mr-3 d-inline-block"><span class="repo-language-color"></span><span itemprop="programmingLanguage">TypeScript</span></span><a class="pinned-item-meta Link--muted" href="/sample-owner/demo/stargazers">5</a><a class="pinned-item-meta Link--muted" href="/sample-owner/demo/forks">2</a></p>
					</div>
				</div>

		1,234 contributions in the last year
