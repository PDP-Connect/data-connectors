name: Deploy Registry Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Polyfill Connectors"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "registry-site/**"
      - "scripts/websub-publisher/**"
      - ".github/workflows/pages.yml"

permissions:
  actions: read
  contents: read
  packages: read
  pages: write
  id-token: write

# Releases and full-site deploys must not interleave. Queueing keeps a later
# site update from replacing a pending connector publication; the queue is finite.
concurrency:
  group: publish-polyfill-connectors
  cancel-in-progress: false
  queue: max

jobs:
  publication-gate:
    if: >-
      ${{
        github.repository == 'PDP-Connect/data-connectors' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name != 'workflow_run' || (
          (github.event.workflow_run.path == '.github/workflows/publish-polyfill-connectors.yml' ||
           github.event.workflow_run.path == '.github/workflows/publish-polyfill-connectors.yml@main' ||
           github.event.workflow_run.path == '.github/workflows/publish-polyfill-connectors.yml@refs/heads/main') &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main'
        ))
      }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Check whether catalog publication ran
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != workflow_run ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ && "$RELEASE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/attempts/${RELEASE_RUN_ATTEMPT}/jobs?per_page=100" > "$RUNNER_TEMP/catalog-jobs.json"
          deploy=$(node scripts/websub-publisher/publication-ran.mjs "$RUNNER_TEMP/catalog-jobs.json")
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  build:
    needs: publication-gate
    if: ${{ needs.publication-gate.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      feed_sha256: ${{ steps.feed.outputs.sha256 }}
      source_sha: ${{ steps.feed.outputs.source_sha }}
      deploy: ${{ steps.compare.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --ignore-scripts

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: "1.3.3"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Build the feed from the current signed catalog
        id: feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/websub-publisher/materialize-catalog.sh registry-site/catalog/updates.atom
          echo "sha256=$(sha256sum registry-site/catalog/updates.atom | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compare the public feed
        id: compare
        env:
          FEED_SHA256: ${{ steps.feed.outputs.sha256 }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$FEED_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          deploy=true
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            topic=$(node --input-type=module -e 'import { TOPIC_URL } from "./scripts/websub-publisher/config.mjs"; process.stdout.write(TOPIC_URL)')
            if metadata=$(curl --silent --show-error --max-time 10 --max-filesize 65536 --proto '=https' --output "$RUNNER_TEMP/live-catalog-feed.atom" --write-out '%{http_code} %{content_type}' "$topic"); then
              http_status=${metadata%% *}
              content_type=${metadata#* }
              content_type=${content_type%%;*}
              if [[ "$http_status" == 200 && "${content_type,,}" == application/atom+xml ]] && [[ "$(sha256sum "$RUNNER_TEMP/live-catalog-feed.atom" | cut -d' ' -f1)" == "$FEED_SHA256" ]]; then
                deploy=false
                echo "feed already at $FEED_SHA256"
              fi
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: steps.compare.outputs.deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the complete registry site
        if: steps.compare.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: registry-site

  deploy:
    needs: build
    if: ${{ needs.build.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notify:
    if: ${{ vars.CATALOG_WEBSUB_NOTIFY_ENABLED == 'true' }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Verify the public feed and notify the hub
        env:
          FEED_SHA256: ${{ needs.build.outputs.feed_sha256 }}
        run: node scripts/websub-publisher/static-notify.mjs --sha256 "$FEED_SHA256"
