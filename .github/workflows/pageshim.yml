name: PageShim target

# Builds every connector whose manifest requirements fit the `pageshim` host (the Vana mobile
# host) and runs it in the PageShim harness against recorded fixtures.
# See scripts/pageshim/build.mjs. No path filter, so the check never sits
# pending on a PR.

on:
  push:
    branches: [main]
  # Only PRs into main. A PR into an integration branch that batches changes
  # is checked locally instead; the batch PR into main runs this workflow.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pageshim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-shards:
    name: PageShim harness (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep the sequential connector gates separate from the regression tests.
    # Together they exceed the job deadline; each shard takes about 8 minutes.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: connector gates
            args: --test-name-pattern="pageshim gate" scripts/pageshim/pageshim.test.mjs
          - name: regressions
            args: --test-skip-pattern="pageshim gate" scripts/pageshim/capabilities.test.mjs scripts/pageshim/pageshim.test.mjs scripts/pageshim/pageshim-streaming.test.mjs scripts/pageshim/chatgpt-replay.test.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: packages/polyfill-connectors/package.json

      - name: Install workspace dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --ignore-scripts

      - name: Install Chromium for the harness
        run: npx playwright install --with-deps chromium

      - name: Build and run the harness
        run: node --test ${{ matrix.shard.args }}

  harness:
    name: PageShim harness
    needs: harness-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both shards to pass
        env:
          SHARD_RESULT: ${{ needs.harness-shards.result }}
        run: test "$SHARD_RESULT" = success
