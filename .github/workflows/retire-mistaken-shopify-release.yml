name: Retire Mistaken Shopify Release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify and delete the two mistaken Shopify package versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          versions_api="orgs/PDP-Connect/packages/container/connector%2Fshopify/versions"
          artifact_id=1285377103
          artifact_digest="sha256:bba350ecc8bc7ce606f7c50788d111c9b65d6af0f34bea00c41ec6ca0dffdb18"
          artifact_tag="1.0.0"
          signature_id=1285377498
          signature_digest="sha256:4f4d5b550365875c1a18488e541612561a343d07dcaedc2d38973af8c0e5476e"
          signature_tag="sha256-bba350ecc8bc7ce606f7c50788d111c9b65d6af0f34bea00c41ec6ca0dffdb18.sig"

          verify_version() {
            local id="$1" digest="$2" tag="$3"
            gh api "$versions_api/$id" | jq -e \
              --argjson id "$id" \
              --arg digest "$digest" \
              --arg tag "$tag" \
              '.id == $id
               and .name == $digest
               and .metadata.package_type == "container"
               and .metadata.container.tags == [$tag]' >/dev/null
          }

          # Check both immutable package version records before deleting either.
          verify_version "$artifact_id" "$artifact_digest" "$artifact_tag"
          verify_version "$signature_id" "$signature_digest" "$signature_tag"

          gh api --method DELETE "$versions_api/$artifact_id"
          gh api --method DELETE "$versions_api/$signature_id"
