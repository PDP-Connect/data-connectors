name: Polyfill Connectors

# Required-check design mirrors .github/workflows/cross-repo-integrity.yml (see that file's
# top-of-file comment for the full citation trail — PDPP-gateB-final-closure-deep-redteam-2026-08-18.md
# finding B1 / hardening 12.3): no `pull_request.paths` filter (a required workflow skipped via
# path filtering leaves its check permanently "Pending" and blocks merging), a `changes` job
# that always runs and computes relevance via plain `git diff`, the real `verify` job gated on
# that relevance via `needs`+`if`, and one stable always-produced `gate` job
# ("Polyfill Connectors Gate") that is the only context named in branch protection — never
# `verify + test` directly, since GitHub's implicit `success()` on a bare job-level `if:`
# (github/docs#4823) would otherwise let a broken `changes` job silently report green instead
# of failing.

on:
  push:
    branches: [main]
    paths:
      - "packages/polyfill-connectors/**"
      - "package.json"
      - "scripts/groupme-mutation/**"
      - ".github/scripts/groupme-mutation-admission.mjs"
      - "connectors/**"
      - ".github/workflows/polyfill-connectors.yml"
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: polyfill-connectors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      harness: ${{ steps.filter.outputs.harness }}
      groupme: ${{ steps.filter.outputs.groupme }}
      mutation_required: ${{ steps.filter.outputs.mutation_required }}
      base_sha: ${{ steps.filter.outputs.base_sha }}
      head_sha: ${{ steps.filter.outputs.head_sha }}
      merge_base_sha: ${{ steps.filter.outputs.merge_base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether relevant paths changed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/groupme-mutation-admission.mjs

  verify:
    name: verify + test
    needs: changes
    if: needs.changes.outputs.relevant == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24: this package's node:test usage (--test-concurrency,
          # --test-timeout) and node:fs/promises glob() need it; the rest of
          # this repo's workflows run Node 20 for unrelated npm-only scripts.
          node-version: "24"

      - name: Install workspace dependencies
        # Root connector files resolve dependencies from the root workspace.
        # --ignore-scripts skips patchright's
        # postinstall browser download; the browser the tests DO need is
        # installed explicitly in the next step, so the skip stays deliberate
        # rather than accidental.
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/groupme-mutation-install.log"

      - name: Install Chromium for the capture-redaction proofs
        # `src/capture-trace-redaction.test.ts` launches a real browser: the
        # thing under test is what Playwright WRITES to disk (trace zips,
        # screenshots, DOM snapshots), so a stub cannot prove the redaction.
        # `--with-deps` because the runner image carries no shared libs for it.
        # The root workspace install provides `playwright` to the package.
        #
        # Ported from PDP-Connect/pdpp's own polyfill-connectors workflow,
        # which already installs exactly this for exactly this suite. Move A
        # brought that suite into this repo but not the browser step, so the
        # install comment above ("verify + test don't launch a browser") became
        # false and six tests failed on a missing chrome-headless-shell.
        working-directory: packages/polyfill-connectors
        run: npx playwright install --with-deps chromium

      - name: Install isolated mutation tools
        run: npm ci --prefix scripts/groupme-mutation/tools --ignore-scripts --no-audit --no-fund

      - name: Test GroupMe mutation helpers
        # Root helper tests fall outside the package's scripts/**/*.test.mjs glob.
        run: node --test scripts/groupme-mutation/dispatch.test.mjs scripts/groupme-mutation/tools.test.mjs scripts/groupme-mutation/select.test.mjs scripts/groupme-mutation/changes.test.mjs scripts/groupme-mutation/evidence.test.mjs scripts/groupme-mutation/admission.test.mjs

      - name: Verify (typecheck + biome check)
        working-directory: packages/polyfill-connectors
        run: npm run verify

      - name: Check connector stdout stays protocol-only
        # This scan targets connectors/ at the repository root, outside the
        # package-local verification scope.
        run: npm run connector-stdout-console:check

      - name: Test
        working-directory: packages/polyfill-connectors
        # Excludes the @pdpp/reference-contract-dependent suites; see
        # scripts/run-tests.mjs and tsconfig.json for the file list and the
        # reinstatement note (that package isn't part of Move A's scope).
        run: npm run test

      - name: Pack, install, and run (proves a real npm install of the published tarball works)
        # This step's own dependency install above used --ignore-scripts, so
        # it would never catch a regression here: a real consumer's plain
        # `npm ci` (no --ignore-scripts) runs this package's postinstall
        # hook unconditionally, and a .ts postinstall crashes there with
        # ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING (Node refuses to strip
        # types from any file under node_modules). That crash blocked every
        # downstream consumer's CI at the dependency-install step, before
        # any of that consumer's own code ran — see scripts/pack-install-run.mjs.
        working-directory: packages/polyfill-connectors
        run: npm run pack-install-run

  connector-evidence:
    name: Connector evidence summary
    # INFORMATIONAL ONLY — deliberately absent from `gate`'s `needs` below.
    # A missing or stale claim.json must never block a PR (see
    # scripts/connector-evidence-summary.ts's module doc comment); this job
    # only fails on a COMMITTED claim.json that doesn't parse, which is a
    # real repo defect worth a red X, distinct from "no evidence yet".
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine which connectors this PR touches
        id: connectors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          CHANGED_CONNECTORS="$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA" \
            | grep -E '^connectors/' \
            | sed -E 's#^connectors/([^/]+)/.*#\1#' \
            | sort -u)"
          echo "$CHANGED_CONNECTORS"
          {
            echo "list<<EOF"
            echo "$CHANGED_CONNECTORS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.connectors.outputs.list != ''
        with:
          node-version: "24"

      - name: Install workspace dependencies
        if: steps.connectors.outputs.list != ''
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --ignore-scripts

      - name: Summarize replay evidence and recompute code-binding digests
        if: steps.connectors.outputs.list != ''
        id: summary
        env:
          CHANGED_CONNECTORS: ${{ steps.connectors.outputs.list }}
          CONNECTOR_EVIDENCE_LABELS_FILE: ${{ runner.temp }}/connector-evidence-labels.txt
        working-directory: packages/polyfill-connectors
        run: node --import tsx scripts/connector-evidence-summary.ts $CHANGED_CONNECTORS

      # Labels need a WRITE token. On a pull_request from a FORK, GitHub
      # downgrades GITHUB_TOKEN to read-only no matter what this job's
      # `permissions:` block says (security default — this workflow stays
      # plain `pull_request`, never `pull_request_target`, so it never runs
      # with the base repo's elevated token against untrusted code). Without
      # this guard, every outside contributor's PR would get a false-red
      # 403 here. The job summary table above still prints unconditionally
      # (GITHUB_STEP_SUMMARY needs no token) — only the label mutation is
      # same-repo-only.
      - name: Ensure the three evidence labels exist
        if: steps.connectors.outputs.list != '' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "evidence: author-replay" --color 0E8A16 \
            --description "A connector's committed replay claim matches this PR's code" --force
          gh label create "evidence: stale" --color D93F0B \
            --description "A connector's committed replay claim predates a code/manifest change in this PR" --force
          gh label create "evidence: none" --color CCCCCC \
            --description "A touched connector has no committed replay claim yet" --force

      - name: Note that labels are skipped for fork PRs
        if: steps.connectors.outputs.list != '' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "_(Labels are only applied on same-repo PRs — GITHUB_TOKEN is read-only on a fork PR.)_" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the evidence label(s)
        if: steps.connectors.outputs.list != '' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELS_FILE: ${{ runner.temp }}/connector-evidence-labels.txt
          # Every label this job can ever apply — used to remove whichever
          # ones no longer apply on a re-run, so a PR never accumulates a
          # stale "evidence: stale" label from an earlier push after the
          # author fixes it.
          ALL_LABELS: "evidence: author-replay,evidence: stale,evidence: none"
        run: |
          if [ ! -f "$LABELS_FILE" ]; then
            echo "no labels file written (summary step found nothing to report) — skipping"
            exit 0
          fi
          WANTED="$(tr '\n' ',' < "$LABELS_FILE" | sed 's/,$//')"
          echo "wanted labels: $WANTED"
          IFS=',' read -ra ALL_ARR <<< "$ALL_LABELS"
          IFS=',' read -ra WANTED_ARR <<< "$WANTED"
          for label in "${ALL_ARR[@]}"; do
            is_wanted=false
            for w in "${WANTED_ARR[@]}"; do
              [ "$label" = "$w" ] && is_wanted=true
            done
            if [ "$is_wanted" = true ]; then
              gh pr edit "$PR_NUMBER" --add-label "$label" || echo "::warning::could not add label '$label' (may not exist in this repo yet)"
            else
              gh pr edit "$PR_NUMBER" --remove-label "$label" 2>/dev/null || true
            fi
          done

  groupme-mutation:
    # INITIAL EVIDENCE, NOT REQUIRED. Visible as its own check and red when the canary or
    # the reconciled population fails; the gate below records it as optional. Promotion to
    # required is a root decision after hosted CI reproduces the local evidence.
    name: GroupMe mutation evidence
    needs: [changes, verify]
    if: always() && needs.changes.outputs.mutation_required == 'true' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') && (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Mutated ranges name checked-out lines, so HEAD must be the PR head commit,
          # not the default merge commit.
          ref: ${{ needs.changes.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install workspace dependencies
        env:
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/groupme-mutation-install.log"

      - name: Install isolated mutation tools
        # Before the runner: it refuses to start without the pinned Stryker and Vitest tree.
        run: npm ci --prefix scripts/groupme-mutation/tools --ignore-scripts --no-audit --no-fund

      - name: Run the official GroupMe mutation invocation
        # One Stryker run: changed production ranges plus the canary, native Vitest only.
        # The report directory must not exist; the artifact glob below includes it and its log.
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
          MERGE_BASE: ${{ needs.changes.outputs.merge_base_sha }}
          REPORT: ${{ runner.temp }}/groupme-mutation-evidence
        run: |
          set -o pipefail
          npm run groupme-mutation -- --mode diff --base "$BASE_SHA" --head "$HEAD_SHA" --merge-base "$MERGE_BASE" --report "$REPORT" 2>&1 | tee "$REPORT.log"

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: groupme-mutation-${{ github.run_id }}
          path: ${{ runner.temp }}/groupme-mutation-*
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: Polyfill Connectors Gate
    needs: [changes, verify, groupme-mutation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Evaluate all job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          MUTATION_RESULT: ${{ needs.groupme-mutation.result }}
          MUTATION_REQUIRED: ${{ needs.changes.outputs.mutation_required }}
          # Keep at "optional" until the root promotes the mutation evidence to required.
          MUTATION_ENFORCEMENT: optional
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          echo "changes: $CHANGES_RESULT"
          echo "verify:  $VERIFY_RESULT"
          echo "mutation: $MUTATION_RESULT"

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes job did not succeed (result: $CHANGES_RESULT) — cannot trust downstream skip/run decisions"
            exit 1
          fi

          case "$VERIFY_RESULT" in
            success|skipped) ;;
            *)
              echo "::error::verify reported '$VERIFY_RESULT' — expected 'success' or 'skipped'"
              exit 1
              ;;
          esac

          node .github/scripts/groupme-mutation-admission.mjs --gate

          echo "Polyfill Connectors Gate: verify succeeded or was correctly skipped as irrelevant."
