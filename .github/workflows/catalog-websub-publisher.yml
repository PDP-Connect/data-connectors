name: Catalog WebSub publisher

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/websub-publisher/**
      - .github/workflows/catalog-websub-publisher.yml
      - .github/workflows/publish-polyfill-connectors.yml
  push:
    branches: [main]
    paths:
      - scripts/websub-publisher/**
      - .github/workflows/catalog-websub-publisher.yml
      - .github/workflows/publish-polyfill-connectors.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm --prefix scripts/websub-publisher ci --ignore-scripts
      - run: npm --prefix scripts/websub-publisher run build
      - run: node --test scripts/websub-publisher/test/client-workflow.test.mjs scripts/websub-publisher/test/service.test.mjs scripts/websub-publisher/test/immediate.test.mjs scripts/websub-publisher/test/rollout.test.mjs scripts/websub-publisher/test/retry.test.mjs
