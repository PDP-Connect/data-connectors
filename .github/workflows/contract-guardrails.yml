name: Contract Guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  contract-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install contract tooling dependencies
        run: npm ci

      - name: Validate manifests (HC-MANIFEST-CONTRACT-001/002/003, HC-VERSIONING-INDEPENDENT-001, HC-WHAT-NOT-TO-DO-002)
        run: node scripts/validate-manifests.mjs

      - name: Check manifests normalized
        run: node scripts/normalize-manifests.mjs --check

      - name: Validate scope-schema coverage (HC-RESULT-CONTRACT-001)
        run: node scripts/validate-scope-schemas.mjs

      - name: Test catalog and connector artifact contracts
        run: node --test scripts/connector-artifact-contract.test.mjs scripts/generate-scope-catalog.test.mjs

      - name: Test schema health check gate
        run: node --test scripts/schema-health-gate.test.mjs

      - name: Test installer artifact contracts
        run: npm run installer:test

      - name: Checkout pinned PDPP source for GitHub artifact provenance
        run: |
          git clone --filter=blob:none https://github.com/PDP-Connect/pdpp.git "$RUNNER_TEMP/pdpp-github"
          git -C "$RUNNER_TEMP/pdpp-github" checkout 6d2be0a2a1c052afcffc8ec035190e1dffc3c128

      - name: Test GitHub PDPP artifact provenance
        env:
          PDPP_GITHUB_SOURCE_ROOT: ${{ runner.temp }}/pdpp-github
        run: npm run github-pdpp:test

      - name: Checkout pinned PDPP source for ChatGPT artifact provenance
        run: |
          git clone --filter=blob:none https://github.com/PDP-Connect/pdpp.git "$RUNNER_TEMP/pdpp-chatgpt"
          git -C "$RUNNER_TEMP/pdpp-chatgpt" checkout 2ad6eedce1deecf8e15dcceabe0464ba81d66039

      - name: Test ChatGPT PDPP artifact provenance
        env:
          PDPP_CHATGPT_SOURCE_ROOT: ${{ runner.temp }}/pdpp-chatgpt
        run: npm run chatgpt-pdpp:test

      - name: Checkout pinned PDPP source for WHOOP artifact provenance
        run: |
          git clone --filter=blob:none https://github.com/PDP-Connect/pdpp.git "$RUNNER_TEMP/pdpp-whoop"
          git -C "$RUNNER_TEMP/pdpp-whoop" checkout 4c785e1f5816b09b113f011ab46066f8057d9959

      - name: Test WHOOP PDPP artifact provenance
        env:
          PDPP_WHOOP_SOURCE_ROOT: ${{ runner.temp }}/pdpp-whoop
        run: npm run whoop-pdpp:test

      - name: Check source/scope catalog generated files
        run: node scripts/generate-scope-catalog.mjs --check

      - name: Validate connector fixtures
        run: node scripts/generate-fixture-index.mjs --validate-only

      - name: Check fixture index
        run: node scripts/generate-fixture-index.mjs --check

      - name: Check connector index and artifacts
        run: node scripts/generate-connector-index.mjs --check

      - name: Check page API additive-only (HC-PHASE4-PAGE-API-ADDITIVE-001)
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: node scripts/check-page-api-additive.mjs

      - name: Check source_id stability (HC-COMPAT-SOURCE-ID-001)
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: node scripts/check-source-id-stability.mjs

      - name: Check scope schemas additive (HC-COMPAT-ADDITIVE-SCHEMA-001)
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: node scripts/check-additive-schemas.mjs

      - name: Check SPDX license headers
        run: node scripts/check-spdx-headers.mjs

      - name: Check PDPP authoring docs and profile vocabularies
        run: npm run pdpp:authoring:check
