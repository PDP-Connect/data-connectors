name: Contract Guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  contract-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install contract tooling dependencies
        run: npm ci

      - name: Check frozen historical scope, fixture, and artifact contracts
        run: npm run historical-contract:check

      - name: Check packed library manifest projection
        run: npm run polyfill-library-metadata:check

      - name: Test historical artifact contracts
        run: npm run historical-contract:test

      - name: Test installer artifact contracts
        run: npm run installer:test

      - name: Test publish ref gate
        run: node --test scripts/publish-ref-gate.test.mjs

      - name: Test publish tag guard
        run: node --test scripts/publish-tag-guard.test.mjs

      - name: Test manifest lookup classifier
        run: node --test scripts/lookup-manifest.test.mjs

      - name: Check scope schemas additive (HC-COMPAT-ADDITIVE-SCHEMA-001)
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: node scripts/check-additive-schemas.mjs

      - name: Check SPDX license headers
        run: node scripts/check-spdx-headers.mjs
